<!DOCTYPE html>
<html lang="en" data-theme="pink">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yun ♡</title>
<meta name="description" content="professional sleepyhead">
<meta name="theme-color" content="#ffd6e8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --accent:#ffbcd9; --accent2:#d8c9ff; --deep:#ec7fb2;
  --bg: color-mix(in srgb, var(--accent) 30%, #fff);
  --bg2: color-mix(in srgb, var(--accent2) 28%, #fff);
  --glass: rgba(255,255,255,.64);
  --glass-line: rgba(255,255,255,.95);
  --solid:#fffafc;
  --ink:#6a5070; --muted:#9d87a6;
  --chip: color-mix(in srgb, var(--accent) 32%, #fff);
  --line: color-mix(in srgb, var(--accent) 75%, #fff);
  --dot: color-mix(in srgb, var(--accent) 50%, transparent);
  --glow: color-mix(in srgb, var(--accent) 65%, transparent);
}
html[data-theme="pink"]{--accent:#ffbcd9;--accent2:#d8c9ff;--deep:#ec7fb2}
html[data-theme="lavender"]{--accent:#d6c6ff;--accent2:#c2e6ff;--deep:#9b7fe6}
html[data-theme="sky"]{--accent:#bfe2ff;--accent2:#ffd1e6;--deep:#5fa8e0}
html[data-theme="mint"]{--accent:#bdeedb;--accent2:#fff0b8;--deep:#3fb98d}
html[data-theme="peach"]{--accent:#ffd3c0;--accent2:#ffc8e0;--deep:#f08a62}
html[data-theme="white"]{
  --accent:#e4e2ea; --accent2:#f2f0f6; --deep:#a29db2;
  --bg:#fcfcfe; --bg2:#efeef3; --glass:rgba(255,255,255,.7); --solid:#ffffff;
  --ink:#5c5866; --muted:#9a96a6; --chip:#f5f4f8; --line:#dcd9e3;
  --dot:rgba(150,145,170,.22); --glow:rgba(185,180,205,.42);
}
html[data-theme="white"] .tab.on{color:#4d4957}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg: color-mix(in srgb, var(--accent) 16%, #1d1726);
    --bg2: color-mix(in srgb, var(--accent2) 16%, #1d1726);
    --glass: rgba(42,32,54,.66);
    --glass-line: rgba(255,255,255,.16);
    --solid:#2a2034;
    --ink:#fbeefc; --muted:#cdb7d4;
    --chip: color-mix(in srgb, var(--accent) 26%, #2a2034);
    --line: color-mix(in srgb, var(--accent) 50%, #2a2034);
    --dot: color-mix(in srgb, var(--accent) 20%, transparent);
    --glow: color-mix(in srgb, var(--accent) 35%, transparent);
  }
  html[data-theme="white"]{
    --bg:#1e1d23; --bg2:#2a2830; --glass:rgba(48,46,56,.66); --solid:#2c2a33;
    --ink:#f3f1f7; --muted:#bdb8c9; --chip:#3a3842; --line:#55525f;
    --dot:rgba(220,215,235,.12); --glow:rgba(200,195,220,.18);
  }
}
*{box-sizing:border-box}
body{margin:0; min-height:100vh; color:var(--ink); font-family:'Gaegu', ui-rounded, sans-serif; font-size:19px; line-height:1.4; overflow-x:hidden}

.bgl{
  position:fixed; inset:0; z-index:-1;
  background:
    radial-gradient(circle at 18% 12%, color-mix(in srgb, var(--accent2) 70%, transparent) 0, transparent 38%),
    radial-gradient(circle at 85% 82%, color-mix(in srgb, var(--accent) 75%, transparent) 0, transparent 42%),
    radial-gradient(var(--dot) 1.5px, transparent 1.7px) 0 0/24px 24px,
    linear-gradient(165deg, var(--bg), var(--bg2));
}
.bgl.img{background-size:cover; background-position:center}
.bgl.img::after{content:''; position:absolute; inset:0; background:color-mix(in srgb, var(--bg) 35%, transparent)}

.wrap{position:relative; z-index:1; min-height:100vh; display:grid; place-items:center; padding:84px 16px 50px}
body.editing .wrap{padding-top:130px}
#app{width:100%; max-width:420px}
.card{
  width:100%; text-align:center;
  background:var(--glass); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
  border:1.5px solid var(--glass-line); border-radius:28px;
  padding:30px 22px 22px; box-shadow:0 12px 44px var(--glow);
}
.card.pop{animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0; transform:scale(.88) translateY(14px)}}

.avwrap{position:relative; width:124px; margin:0 auto 14px}
.avatar{
  width:124px; height:124px; border-radius:50%; overflow:hidden; display:grid; place-items:center;
  font-size:64px; line-height:1; background:var(--chip);
  border:4px solid var(--glass-line); box-shadow:0 0 0 3px var(--accent), 0 0 30px var(--glow);
}
.avatar img{width:100%; height:100%; object-fit:cover}
.decor{position:absolute; top:-8px; right:-12px; font-size:34px; transform:rotate(18deg); line-height:1}
h1{font-family:'Mochiy Pop One', 'Gaegu', sans-serif; font-weight:400; font-size:30px; margin:0; letter-spacing:.5px; text-shadow:0 0 14px var(--glow), 0 0 2px var(--glass-line); overflow-wrap:anywhere}
.tagline{min-height:1.4em; margin:6px 0 4px; color:var(--muted)}
.caret{display:inline-block; width:2px; height:1em; background:var(--deep); margin-left:2px; vertical-align:-2px; animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.loc{font-size:16px; color:var(--muted); margin:0 0 12px}
.meta{margin-top:-8px}
.dt{font:inherit; font-size:15px; border:1.5px solid var(--line); border-radius:8px; padding:1px 6px; background:var(--solid); color:var(--ink)}
.badges{display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin-bottom:18px}
.chip{display:inline-flex; align-items:center; gap:4px; background:var(--chip); border:1.5px solid var(--glass-line); border-radius:999px; padding:1px 11px; font-size:16px}

.socials{display:flex; flex-wrap:wrap; justify-content:center; gap:14px; margin-bottom:18px}
.soc{display:flex; flex-direction:column; align-items:center; gap:3px; text-decoration:none; color:var(--muted); font-size:13px; width:68px}
.soc i{
  font-style:normal; width:48px; height:48px; border-radius:50%; display:grid; place-items:center; font-size:22px;
  background:var(--chip); border:2px solid var(--glass-line); box-shadow:0 4px 14px var(--glow); transition:transform .2s;
}
button.soc{font:inherit; font-size:13px; border:none; background:transparent; padding:0; cursor:pointer}
.soc:hover i{transform:translateY(-4px) rotate(-8deg)}
.soc span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
.soc small{font-size:12px; margin-top:-3px; white-space:nowrap; opacity:.85}
button.soc{width:auto; min-width:68px}
.socedit{display:flex; align-items:center; gap:6px; margin:6px 0; text-align:left}
.socedit input{flex:1; min-width:0; font:inherit; font-size:15px; border:1.5px solid var(--line); border-radius:8px; padding:3px 6px; background:var(--solid); color:var(--ink)}

.morebtn{font:inherit; font-size:17px; cursor:pointer; color:var(--ink); background:transparent; border:1.5px dashed var(--line); border-radius:999px; padding:3px 16px}
.more{margin-top:16px; text-align:left}
.tabs{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:10px}
.tab{cursor:pointer; padding:2px 13px; border-radius:999px; font-size:16px; border:1.5px solid var(--glass-line); background:transparent}
.tab.on{background:var(--accent); color:#5a3d60}
.panel{background:color-mix(in srgb, var(--glass) 70%, transparent); border:1.5px dashed var(--line); border-radius:18px; padding:14px 16px}
.dim{opacity:.5}
.about{white-space:pre-wrap; margin:0 0 10px}
.fav{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:4px 0; border-top:1.5px dotted var(--line)}
.fav .v{text-align:right; color:var(--muted); display:flex; align-items:center; gap:4px}
.cols{display:grid; grid-template-columns:1fr 1fr; gap:12px}
h3{font-family:'Mochiy Pop One', 'Gaegu', sans-serif; font-weight:400; font-size:14px; margin:0 0 6px}
ul{list-style:none; margin:0; padding:0}
li{display:flex; align-items:center; gap:6px; margin:2px 0}
.likes li::before{content:'♡'; color:var(--deep)}
.nope li::before{content:'✕'; color:var(--muted); font-size:13px}
.star li::before{content:'✧'; color:var(--deep)}
.cards{display:grid; grid-template-columns:1fr 1fr; gap:9px}
.icard{position:relative; text-align:center; border:1.5px solid var(--glass-line); background:var(--chip); border-radius:16px; padding:9px 6px}
.icard .ic{display:block; font-size:28px}
.icard b{display:block; font-weight:700}
.icard small{font-size:15px; color:var(--muted)}
.icard .del{position:absolute; top:4px; right:4px}
.foot{font-size:14px; color:var(--muted); margin:18px 0 0}

.enter{
  position:fixed; inset:0; z-index:60; display:grid; place-items:center; cursor:pointer;
  background:color-mix(in srgb, var(--bg) 55%, transparent); -webkit-backdrop-filter:blur(22px); backdrop-filter:blur(22px);
  transition:opacity .6s;
}
.enter span{font-family:'Mochiy Pop One', 'Gaegu', sans-serif; font-size:20px; animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45; transform:scale(.97)}}
.enter.out{opacity:0; pointer-events:none}

/* edit mode */
body.editing .ed:empty::before{content:'type here'; color:var(--muted); opacity:.6}
body:not(.editing) .about:empty{display:none}
body.editing .ed{outline:2px dashed var(--deep); outline-offset:2px; border-radius:6px; min-width:1.5em; cursor:text}
body.editing .ed:focus{outline-style:solid; background:color-mix(in srgb, var(--accent) 25%, transparent)}
.del,.add,.pick,.eye,.hint,.edonly{display:none}
body.editing .del{display:inline-grid}
body.editing .add,body.editing .pick,body.editing .eye{display:inline-flex}
body.editing .hint,body.editing .edonly{display:block}
.del{place-items:center; flex:none; width:20px; height:20px; padding:0; border:none; border-radius:50%; background:var(--deep); color:#fff; font-size:14px; line-height:1; cursor:pointer}
.add,.pick,.eye{align-items:center; gap:3px; margin:6px 3px 0; padding:2px 11px; cursor:pointer; border:1.5px solid var(--deep); border-radius:999px; background:var(--solid); color:var(--ink); font:inherit; font-size:15px; font-weight:700}
.add{border-style:dashed; background:transparent}
.pick.inline{margin:0 0 0 4px; padding:0 8px; font-size:13px; vertical-align:middle}
.eye{margin:0 0 8px}
.hint{font-size:15px; text-align:center; background:var(--solid); border:1.5px dashed var(--deep); border-radius:12px; padding:6px 10px; margin-bottom:16px}
.hint b{color:var(--deep)}
.edonly{text-align:center; margin-top:14px; font-size:16px}

.toolbar{
  position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:30;
  display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:6px;
  background:var(--glass); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  border:1.5px solid var(--glass-line); border-radius:22px; padding:5px 7px; box-shadow:0 4px 16px var(--glow);
  width:max-content; max-width:calc(100% - 20px);
}
.toolbar:empty{display:none}
.toolbar button{font:inherit; cursor:pointer; color:var(--ink)}
.tg{border:none; background:var(--deep); color:#fff !important; border-radius:999px; padding:3px 14px; font-size:16px; font-weight:700}
.sw{width:24px; height:24px; border-radius:50%; border:2px solid #fff; outline:2px solid transparent; padding:0}
.sw.on{outline-color:var(--ink)}
.rs{border:1.5px solid var(--line); background:transparent; border-radius:999px; padding:1px 10px; font-size:14px; white-space:nowrap}
button:focus-visible,a:focus-visible,input:focus-visible,.tab:focus-visible{outline:3px solid var(--deep); outline-offset:2px}

/* picker sheet */
.sheet-bg{position:fixed; inset:0; z-index:90; background:rgba(70,40,70,.28); display:flex; align-items:flex-end; justify-content:center}
.sheet{
  width:100%; max-width:480px; max-height:82vh; display:flex; flex-direction:column; background:var(--solid);
  border-radius:24px 24px 0 0; padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 30px var(--glow); animation:rise .25s ease-out;
}
@keyframes rise{from{transform:translateY(40px); opacity:0}}
.sheet-head{display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:19px; margin-bottom:4px}
.sheet-head .x{border:none; background:transparent; font-size:20px; cursor:pointer; color:var(--ink)}
.sheet-sub{font-size:15px; color:var(--muted); margin:0 0 6px}
.sheet-body{overflow:auto; flex:1; padding:2px}
.gname{font-size:15px; color:var(--muted); margin:10px 0 5px}
.opts{display:flex; flex-wrap:wrap; gap:6px}
.opt{font:inherit; font-size:16px; cursor:pointer; border:1.5px solid var(--line); background:transparent; color:var(--ink); border-radius:999px; padding:3px 12px; text-align:left}
.opt.on{background:var(--accent); border-color:var(--deep); color:#5a3d60}
.opts.grid .opt{font-size:26px; width:50px; height:50px; padding:0; border-radius:14px; text-align:center}
.opts.long .opt{border-radius:14px; white-space:pre-wrap; width:100%; font-size:15px}
.custom{display:flex; gap:6px; margin-top:12px}
.custom input{flex:1; min-width:0; font:inherit; font-size:16px; border:1.5px solid var(--line); border-radius:12px; padding:5px 10px; background:transparent; color:var(--ink)}
.done{margin-top:10px; font:inherit; font-size:17px; font-weight:700; cursor:pointer; border:none; border-radius:14px; padding:8px; background:var(--deep); color:#fff}
.bk{width:100%; height:78px; font:12px/1.3 ui-monospace,monospace; border:1.5px solid var(--line); border-radius:12px; padding:6px 8px; background:transparent; color:var(--ink); resize:vertical; margin-top:4px}
.sheet-scroll{overflow:auto}
.btnrow{display:flex; flex-direction:column; gap:8px; margin-top:10px}

.toast{position:fixed; bottom:18px; left:50%; transform:translate(-50%,20px); opacity:0; z-index:95; background:var(--solid); border:1.5px solid var(--line); border-radius:999px; padding:3px 14px; font-size:16px; transition:.25s; pointer-events:none; white-space:nowrap}
.toast.show{opacity:1; transform:translate(-50%,0)}

.spark{position:fixed; pointer-events:none; z-index:80; font-size:15px; translate:-50% -50%; animation:sp .8s ease-out forwards}
@keyframes sp{to{transform:translateY(-22px) scale(.3) rotate(90deg); opacity:0}}
.float{position:fixed; bottom:-40px; pointer-events:none; z-index:0; opacity:.55; color:var(--deep); animation:up linear infinite}
@keyframes up{to{transform:translateY(-118vh) rotate(40deg)}}
@media (prefers-reduced-motion: reduce){
  .float,.spark,.caret{display:none}
  .card.pop,.enter span,.sheet{animation:none}
}
</style>
</head>
<body>
<div class="bgl" id="bgl"></div>
<div class="toolbar" id="toolbar"></div>
<main class="wrap"><div id="app"></div></main>
<div class="enter" id="enter"><span id="enterText">click to enter ♡</span></div>
<div id="sheet" hidden></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" accept="image/*" id="avfile" hidden>
<input type="file" accept="image/*" id="bgfile" hidden>

    <div>${list('likes','likes', `<h3>${ed('titles.likeHead', S.titles.likeHead)}</h3>`)}</div>
    <div>${list('dislikes','nope', `<h3>${ed('titles.dislikeHead', S.titles.dislikeHead)}</h3>`)}</div></div>`;
  if (t === 'interests') return `<div class="cards">${S.interests.map((c,i) => `<div class="icard">
    <span class="ic">${esc(c.icon)}</span><b>${ed(`interests.${i}.title`, c.title)}</b>
    <small>${ed(`interests.${i}.desc`, c.desc)}</small>${del('interests',i)}</div>`).join('')}</div>${pk('interests','+ 고르기','add')}`;
  return list('byf','star', `<h3>${ed('titles.byfHead', S.titles.byfHead)}</h3>`) +
    `<div style="margin-top:12px">${list('dni','nope', `<h3>${ed('titles.dniHead', S.titles.dniHead)}</h3>`)}</div>`;
}

function render(){

    : `<div class="socials">${S.links.filter(l => linkUrl(l) || handleOf(l)).map(l => { const P = PLAT[l.p] || PLAT.other, url = linkUrl(l);

  document.getElementById('app').innerHTML = `

      ${storageOK ? '✓ 자동 저장 중 · 그래도 꺼질 때를 대비해 <b>💾 백업</b> 코드를 받아 두세요' : '⚠ 이 화면에서는 자동 저장이 안 돼요. <b>💾 백업</b> 코드를 꼭 받아 두세요'}</div>
    <div class="card ${doPop ? 'pop' : ''}">
      <div class="avwrap"><div class="avatar">${av}</div>${S.decor ? `<span class="decor">${esc(S.decor)}</span>` : ''}</div>
      ${pk('avatar','🐰 이모지')}${pk('avphoto','📷 사진')}${pk('decor','🎀 장식')}${S.avatar.img ? pk('avreset','사진 지우기') : ''}
      <h1>${ed('name', S.name)}</h1>
      <p class="tagline">${editing ? ed('tagline', S.tagline) + pk('tagline','▾','inline')
        : `<span id="tw">${typed ? esc(S.tagline) : ''}</span><span class="caret"></span>`}</p>
      ${S.location || editing ? `<p class="loc">${ed('location', S.location)}${pk('location','▾','inline')}</p>` : ''}
      ${editing
        ? `<p class="loc meta">🎂 <input type="date" class="dt" data-path="birthday" value="${esc(S.birthday)}" aria-label="생일"> ${pk('gender', esc(S.gender || '성별 고르기') + ' ▾', 'inline')}</p>`
        : (() => { const parts = [S.birthday && '🎂 ' + fmtBday(S.birthday), S.gender].filter(Boolean);
            return parts.length ? `<p class="loc meta">${parts.map(esc).join(' · ')}</p>` : ''; })()}
      <div class="badges">${S.tags.map((t,i) => `<span class="chip">${esc(t)}${del('tags',i)}</span>`).join('')}${pk('tags','+ 뱃지 고르기','add')}</div>
      ${socials}
      ${editing || !visible.length ? '' : `<button class="morebtn" id="more" aria-expanded="${moreOpen}">${moreOpen ? 'less ▴' : 'more about me ▾'}</button>`}
      ${showMore ? `<div class="more">
        <div class="tabs" role="tablist">${visible.map(t => `<div class="tab ${t===tab?'on':''} ${S.hidden[t]?'dim':''}" role="tab" tabindex="0" data-tab="${t}" aria-selected="${t===tab}">${editing ? ed('titles.'+t, S.titles[t]) : esc(S.titles[t])}</div>`).join('')}</div>
        <div class="panel ${S.hidden[tab]?'dim':''}">

let twTimer;
function typewrite(){
  typed = true;
  const el = document.getElementById('tw'); if (!el) return;
  if (reduce){ el.textContent = S.tagline; return; }
  const chars = [...S.tagline]; let i = 0;
  clearTimeout(twTimer);
  (function step(){ const e2 = document.getElementById('tw'); if (!e2) return; e2.textContent = chars.slice(0, i).join(''); if (i++ < chars.length) twTimer = setTimeout(step, 65); })();
}

/* ---------- picker sheet ---------- */
let sheet = null;
const sheetEl = document.getElementById('sheet');
function openSheet(cfg){
  const items = [];
  const groups = cfg.groups.map(g => ({name:g.name, items:g.items.map(it => { const o = typeof it === 'string' ? {v:it, label:it} : it; items.push(o); return o; })}));
  sheet = {...cfg, groups, items, allowCustom: cfg.allowCustom !== false, order: cfg.multi ? [...(cfg.selected || [])] : null};
  if (cfg.multi){
    const extra = sheet.order.filter(v => !items.some(o => o.v === v));
    if (extra.length){ const g = {name:'내가 추가한 것', custom:true, items:extra.map(v => ({v, label:v}))}; groups.push(g); items.push(...g.items); }
  }
  drawSheet();
}
function drawSheet(){
  if (!sheet){ sheetEl.hidden = true; sheetEl.innerHTML = ''; document.body.style.overflow = ''; return; }
  sheetEl.hidden = false; document.body.style.overflow = 'hidden';
  if (sheet.html){
    sheetEl.innerHTML = `<div class="sheet-bg" data-close="1"><div class="sheet" role="dialog" aria-label="${esc(sheet.title)}">
      <div class="sheet-head"><span>${esc(sheet.title)}</span><button class="x" data-close="1" aria-label="닫기">✕</button></div><div class="sheet-scroll">${sheet.html}</div></div></div>`;
    return;
  }
  const body = sheet.groups.map(g => `${g.name ? `<div class="gname">${esc(g.name)}</div>` : ''}
    <div class="opts ${sheet.grid ? 'grid' : ''} ${sheet.long ? 'long' : ''}">${g.items.map(o => {
      const on = sheet.multi ? sheet.order.includes(o.v) : sheet.current === o.v;
      return `<button class="opt ${on ? 'on' : ''}" data-o="${sheet.items.indexOf(o)}" aria-pressed="${on}">${esc(o.label)}</button>`; }).join('')}</div>`).join('');
  sheetEl.innerHTML = `<div class="sheet-bg" data-close="1"><div class="sheet" role="dialog" aria-label="${esc(sheet.title)}">
    <div class="sheet-head"><span>${esc(sheet.title)}</span><button class="x" data-close="1" aria-label="닫기">✕</button></div>
    ${sheet.sub ? `<p class="sheet-sub">${esc(sheet.sub)}</p>` : ''}
    <div class="sheet-body">${body || '<p class="sheet-sub">아래에 직접 적어 주세요</p>'}</div>
    ${sheet.allowCustom ? `<div class="custom"><input id="customIn" placeholder="직접 입력하기" maxlength="80"><button class="opt" id="customAdd">추가</button></div>` : ''}
    ${sheet.multi ? `<button class="done" id="sheetDone">완료 (${sheet.order.length}개 선택)</button>` : ''}
  </div></div>`;
}
function finish(v){ const cb = sheet.onDone; sheet = null; drawSheet(); cb(v); render(); scheduleSave(); }
function addCustom(){
  const inp = document.getElementById('customIn'); const v = inp.value.trim(); if (!v) return;
  if (!sheet.multi) return finish(v);
  if (!sheet.order.includes(v)) sheet.order.push(v);
  if (!sheet.items.some(o => o.v === v)){
    let g = sheet.groups.find(g => g.custom);
    if (!g){ g = {name:'내가 추가한 것', custom:true, items:[]}; sheet.groups.push(g); }
    const o = {v, label:v}; g.items.push(o); sheet.items.push(o);
  }
  drawSheet();
  const b = sheetEl.querySelector('.sheet-body'); b.scrollTop = b.scrollHeight;
}
sheetEl.addEventListener('click', e => {
  if (e.target.dataset.close){ sheet = null; drawSheet(); return; }
  const ob = e.target.closest('[data-o]');
  if (ob){
    const o = sheet.items[+ob.dataset.o];
    if (!sheet.multi) return finish(o.v);
    const k = sheet.order.indexOf(o.v);
    if (k >= 0) sheet.order.splice(k, 1); else sheet.order.push(o.v);
    ob.classList.toggle('on', k < 0); ob.setAttribute('aria-pressed', k < 0);
    document.getElementById('sheetDone').textContent = `완료 (${sheet.order.length}개 선택)`;
    return;
  }
  const id = e.target.closest('button')?.id;
  if (id === 'customAdd') addCustom();
  if (id === 'sheetDone') finish(sheet.order);
  if (id === 'dl') download();
  if (id === 'cp') copyCode();
  if (id === 'bkcopy') copyBackup();
  if (id === 'bkload') loadBackup();
});
sheetEl.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'customIn'){ e.preventDefault(); addCustom(); } });
addEventListener('keydown', e => { if (e.key === 'Escape' && sheet){ sheet = null; drawSheet(); } });

function pick(key, i){
  const multiStr = {tags:['뱃지 고르기', TAG_GROUPS], likes:['좋아하는 것', [{items:LIKES}]], dislikes:['별로인 것', [{items:DISLIKES}]], byf:['팔로우 전에 알아줘 (BYF)', [{items:BYF}]], dni:['교류 사양 (DNI)', [{items:DNI}]]};
  const single = {tagline:['한 줄 소개', TAGLINES], location:['위치 문구', LOCATIONS], footer:['맨 아래 문구', FOOTERS], enter:['입장 화면 문구', ENTERS]};
  if (multiStr[key]) return openSheet({title:multiStr[key][0], sub:'여러 개 고를 수 있어요', groups:multiStr[key][1], multi:true, selected:S[key], onDone:v => { S[key] = v; }});
  if (single[key]) return openSheet({title:single[key][0], groups:[{items:single[key][1]}], current:S[key], onDone:v => { S[key] = v; }});
  if (key === 'gender') return openSheet({title:'성별', groups:[{items:GENDERS}], current:S.gender, onDone:v => { S.gender = v; }});
  if (key === 'about') return openSheet({title:'자기소개 예시', sub:'고른 다음 글자를 눌러서 고칠 수 있어요', long:true, allowCustom:false,
    groups:[{items:ABOUTS.map(a => a.replace('{name}', S.name))}], onDone:v => { S.about = v; }});
  if (key === 'avatar') return openSheet({title:'프로필 이모지', grid:true, groups:[{items:AVATARS}], current:S.avatar.emoji, onDone:v => { S.avatar = {emoji:v, img:''}; }});
  if (key === 'decor') return openSheet({title:'프로필 장식', grid:true, allowCustom:false, groups:[{items:DECOR}], current:S.decor, onDone:v => { S.decor = v; }});
  if (key === 'avphoto') return document.getElementById('avfile').click();
  if (key === 'avreset'){ S.avatar.img = ''; render(); scheduleSave(); return; }
  if (key === 'interests') return openSheet({title:'관심사 고르기', sub:'여러 개 고를 수 있어요', multi:true,
    groups:[{items:INTERESTS.map(o => ({v:o.title, label:o.icon + ' ' + o.title}))}], selected:S.interests.map(o => o.title),
    onDone:v => { S.interests = v.map(t => S.interests.find(o => o.title === t) || clone(INTERESTS.find(o => o.title === t) || {icon:'⭐', title:t, desc:''})); }});
  const platItems = Object.entries(PLAT).map(([k,p]) => ({v:k, label:p.icon + ' ' + p.label}));
  if (key === 'link-add') return openSheet({title:'어떤 링크를 추가할까요?', allowCustom:false, groups:[{items:platItems}], onDone:v => { S.links.push({p:v, user:'', label:''}); }});
  if (key === 'link-p') return openSheet({title:'링크 종류 바꾸기', allowCustom:false, groups:[{items:platItems}], current:S.links[i].p, onDone:v => { S.links[i].p = v; }});
  if (key === 'fav-add') return openSheet({title:'최애 항목 추가', allowCustom:false,
    groups:[{items:Object.entries(FAV).map(([k,f]) => ({v:k, label:f.label}))}],
    onDone:v => { S.favorites.push({cat:v, value:''}); setTimeout(() => pick('fav-v', S.favorites.length - 1)); }});
  if (key === 'fav-v'){ const f = S.favorites[i], F = FAV[f.cat] || {label:'⭐ favorite', opts:[]};
    return openSheet({title:F.label, groups:F.opts.length ? [{items:F.opts}] : [], current:f.value, onDone:v => { S.favorites[i].value = v; }}); }
}

/* ---------- saving ---------- */
let saveTimer, dirty = false;
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1600); }
function scheduleSave(){ dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(() => save(), 400); }
async function save(quiet){
  clearTimeout(saveTimer);
  if (!storageOK){ dirty = false; return; }
  dirty = false;
  try {
    const r = await window.storage.set(KEY, JSON.stringify(S), false);
    if (!r) throw new Error('no result');
    if (!quiet) toast('저장됨 ♡');
  } catch(e){ dirty = true; toast('저장에 실패했어요. ⬇ 내보내기로 보관하세요'); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && dirty) save(true); });
addEventListener('pagehide', () => { if (dirty) save(true); });

function merge(d){
  const s = Object.assign(clone(DEFAULT), d);
  s.titles = Object.assign({}, DEFAULT.titles, d.titles);
  s.avatar = Object.assign({}, DEFAULT.avatar, d.avatar);
  s.hidden = d.hidden || {};
  return s;
}
async function load(){
  if (SAVED) S = merge(SAVED);
  if (storageOK){
    try { const r = await window.storage.get(KEY, false); if (r && r.value) S = merge(JSON.parse(r.value)); }
    catch(e){ /* nothing saved yet */ }
  }
  render();
}

/* ---------- export ---------- */
function buildExport(){
  const A = '/*DA' + 'TA*/', B = '/*E' + 'ND*/', L = '/*LO' + 'CK*/';
  let h = SRC;
  let i = h.indexOf(A), j = h.indexOf(B, i);
  h = h.slice(0, i + A.length) + JSON.stringify(S).replace(/</g, '\\u003c') + h.slice(j);
  i = h.indexOf(L); j = h.indexOf(B, i);
  h = h.slice(0, i + L.length) + 'true' + h.slice(j);
  h = h.replace(/<title>[\s\S]*?<\/title>/, `<title>${esc(S.name)} ♡</title>`)
       .replace(/<meta name="description" content="[^"]*">/, `<meta name="description" content="${esc(S.tagline)}">`);
  return h;
}
function openExport(){
  sheet = {title:'내 사이트 내보내기', html:`
    <p class="sheet-sub">지금 꾸민 내용이 그대로 들어간 HTML 파일을 만들어요. 이 파일에서는 편집 버튼이 숨겨져서 방문자는 수정할 수 없어요. 주소 끝에 <b>#edit</b>를 붙이면 다시 편집할 수 있어요.</p>
    <div class="btnrow"><button class="done" id="dl">⬇ 파일 다운로드</button><button class="opt" id="cp" style="text-align:center">📋 코드 복사</button></div>`};
  drawSheet();
}
function download(){
  try {
    const url = URL.createObjectURL(new Blob([buildExport()], {type:'text/html'}));
    const a = document.createElement('a'); a.href = url; a.download = (S.name || 'my-bio').replace(/[^\w-]+/g, '') + '-bio.html' ;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('다운로드를 시작했어요');
  } catch(e){ toast('다운로드가 막혀 있어요. 코드 복사를 써 주세요'); }
}
async function copyCode(){
  try { await navigator.clipboard.writeText(buildExport()); toast('코드를 복사했어요 ♡'); }
  catch(e){ toast('복사가 막혀 있어요. 다운로드를 써 주세요'); }
}

/* ---------- backup code ---------- */
function openBackup(){
  sheet = {title:'💾 백업 코드', html:`
    <p class="sheet-sub">아래 코드를 복사해서 메모장이나 카톡 '나와의 채팅'에 붙여 두세요. 다음에 열었을 때 초기화돼 있으면, 아래 칸에 붙여 넣고 불러오기를 누르면 그대로 돌아와요.</p>
    <textarea id="bkout" class="bk" readonly onfocus="this.select()">${esc(JSON.stringify(S))}</textarea>
    <div class="btnrow"><button class="opt" id="bkcopy" style="text-align:center">📋 코드 복사</button></div>
    <p class="sheet-sub" style="margin-top:14px">저장해 둔 코드 불러오기</p>
    <textarea id="bkin" class="bk" placeholder="여기에 코드를 붙여 넣으세요"></textarea>
    <div class="btnrow"><button class="done" id="bkload">불러오기</button></div>`};
  drawSheet();
}
async function copyBackup(){
  const t = document.getElementById('bkout');
  try { await navigator.clipboard.writeText(t.value); toast('복사했어요 ♡'); }
  catch(e){
    t.focus(); t.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(_){}
    toast(ok ? '복사했어요 ♡' : '코드를 길게 눌러 직접 복사해 주세요');
  }
}
function loadBackup(){
  try {
    const d = JSON.parse(document.getElementById('bkin').value.trim());
    if (!d || typeof d !== 'object' || !('name' in d)) throw new Error('bad');
    S = merge(d); sheet = null; drawSheet(); render(); save(); toast('불러왔어요 ♡');
  } catch(e){ toast('코드가 올바르지 않아요. 전체를 다시 붙여 넣어 주세요'); }
}

/* ---------- events ---------- */
function enter(){
  if (entered) return;
  entered = true;
  document.getElementById('enter').classList.add('out');
  render();
}
document.getElementById('enter').addEventListener('click', enter);
document.addEventListener('input', e => {
  const el = e.target.closest('[data-path]'); if (!el) return;
  set(el.dataset.path, el.tagName === 'INPUT' ? el.value : el.innerText.replace(/\n$/, ''));
  scheduleSave();
});
document.addEventListener('keydown', e => {
  const el = e.target.closest('.ed');
  if (el && e.key === 'Enter' && !el.classList.contains('multi')){ e.preventDefault(); el.blur(); return; }
  const t = e.target.closest('[data-tab]');
  if (t && !el && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); tab = t.dataset.tab; render(); }
});
document.addEventListener('paste', e => {
  if (!e.target.closest('.ed')) return;
  e.preventDefault(); document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
});
let resetArmed = false;
document.addEventListener('click', e => {
  if (e.target.closest('#sheet')) return;
  const t = e.target.closest('[data-tab]');
  if (t){ if (tab !== t.dataset.tab){ tab = t.dataset.tab; render(); } return; }
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.copy){
    const v = b.dataset.copy;
    (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(() => toast('copied ' + v + ' ♡'), () => toast(v));
    return;
  }
  if (b.id === 'tg'){ editing = !editing; if (editing) enter(); render(); if (!editing) save(); return; }
  if (b.id === 'more'){ moreOpen = !moreOpen; render(); return; }
  if (b.dataset.theme){ S.theme = b.dataset.theme; render(); scheduleSave(); return; }
  if (b.dataset.pick){ pick(b.dataset.pick, b.dataset.i === '' ? undefined : +b.dataset.i); return; }
  if (b.id === 'reset'){
    if (!resetArmed){ resetArmed = true; b.textContent = '한 번 더 누르면 초기화'; setTimeout(() => { resetArmed = false; if (b.isConnected) b.textContent = '↺ 초기화'; }, 3000); return; }
    resetArmed = false; S = clone(DEFAULT); render(); save(); return;
  }
  if (b.dataset.del){ get(b.dataset.del).splice(+b.dataset.i, 1); render(); scheduleSave(); return; }
  if (b.dataset.eye){ S.hidden[b.dataset.eye] = !S.hidden[b.dataset.eye]; render(); scheduleSave(); return; }
  if (b.id === 'bgpick') return document.getElementById('bgfile').click();
  if (b.id === 'bgreset'){ S.bg = ''; render(); scheduleSave(); return; }
  if (b.id === 'export') return openExport();
  if (b.id === 'backup') return openBackup();
});
document.getElementById('avfile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { S.avatar.img = await fitImage(f, 240, true); render(); scheduleSave(); } catch(err){ toast('이 사진은 열 수 없어요'); }
  e.target.value = '';
});
document.getElementById('bgfile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { S.bg = await fitImage(f, 1400, false); render(); scheduleSave(); } catch(err){ toast('이 사진은 열 수 없어요'); }
  e.target.value = '';
});
function fitImage(file, max, square){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas'), x = c.getContext('2d');
        if (square){
          const m = Math.min(img.width, img.height); c.width = c.height = max;
          x.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, max, max);
        } else {
          const k = Math.min(1, max / Math.max(img.width, img.height));
          c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
          x.drawImage(img, 0, 0, c.width, c.height);
        }
        res(c.toDataURL('image/jpeg', .82));
      };
      img.onerror = rej; img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

/* ---------- sparkles ---------- */
const SP = ['✦','♡','✧','⋆','♥'];
function spark(x, y){
  const s = document.createElement('span'); s.className = 'spark';
  s.textContent = SP[Math.random()*SP.length | 0];
  s.style.left = x + 'px'; s.style.top = y + 'px';
  s.style.color = Math.random() < .5 ? 'var(--deep)' : 'var(--accent2)';
  document.body.appendChild(s); setTimeout(() => s.remove(), 800);
}
let lastSpark = 0;
addEventListener('pointermove', e => { if (reduce || sheet) return; const n = Date.now(); if (n - lastSpark < 45) return; lastSpark = n; spark(e.clientX, e.clientY); });
addEventListener('pointerdown', e => { if (reduce || sheet || e.target.closest('.ed,input')) return; for (let i=0;i<6;i++) spark(e.clientX + (Math.random()-.5)*44, e.clientY + (Math.random()-.5)*44); });
if (!reduce){
  const F = ['♡','☆','✿','☁︎','✧'];
  for (let i=0;i<14;i++){
    const f = document.createElement('span'); f.className = 'float';
    f.textContent = F[i % F.length];
    f.style.left = Math.random()*100 + 'vw';
    f.style.fontSize = 14 + Math.random()*16 + 'px';
    const d = 14 + Math.random()*14;
    f.style.animationDuration = d + 's'; f.style.animationDelay = -Math.random()*d + 's';
    document.body.appendChild(f);
  }
}

load();
